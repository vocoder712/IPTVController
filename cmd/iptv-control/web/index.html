<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV LAN2 控制</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#f4f5f7;color:#17202a}main{background:#fff;padding:24px;border:1px solid #d9dde3;border-radius:8px}button{width:100%;padding:18px;margin:8px 0;border:0;border-radius:6px;font-size:1.1rem}#on{background:#18794e;color:#fff}#off{background:#b42318;color:#fff}dd{margin:0 0 12px 0;color:#475467}dt{font-weight:650}</style><main><h1>LAN2 IPTV 开关</h1><button id="on">开启 LAN2</button><button id="off">关闭 LAN2</button><dl><dt>控制状态</dt><dd id="enabled">读取中...</dd><dt>接口状态</dt><dd id="detail">读取中...</dd><dt>提示</dt><dd>当前版本仅验证接口级控制，未包含定时任务。</dd></dl></main><script>const $=id=>document.getElementById(id);async function refresh(){const r=await fetch('/api/v1/status');const s=await r.json();$('enabled').textContent=s.enabled?'开启':'关闭';$('detail').textContent=`${s.interface} / 管理${s.admin_up?'UP':'DOWN'} / operstate=${s.oper_state||'-'} / carrier=${s.carrier||'-'}`;}async function setPort(enabled){$('enabled').textContent='操作中...';await fetch('/api/v1/port',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});await refresh();}$('on').onclick=()=>setPort(true);$('off').onclick=()=>setPort(false);refresh();setInterval(refresh,5000);</script>
